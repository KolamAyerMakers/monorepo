[project]
name = "saltstack"
version = "0.1.0"
authors = [
    { name = "Philippe Muller", email = "pmuller@users.noreply.github.com" }
]
dependencies = [
    "backports-ssl-match-hostname>=3.7",
    "distro>=1.9",
    "jinja2>=3.1",
    "looseversion>=1.3",
    "msgpack>=1.0",
    "pyzmq>=25",
    "salt>=3008.2",
    "saltstack-age>=0.5.0",
    "setuptools>=70",
    "tornado>=6.4",
    "typer>=0.16",
]
requires-python = ">= 3.12, < 3.14"
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
salt-runner = "scripts.salt_runner:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts"]

[dependency-groups]
dev = [
    "ipython>=8.24.0",
    "basedpyright>=1.12.1",
    "pytest>=8.0",
    "ruff>=0.11.0",
    "lefthook>=2.1.0",
    "salt-lint>=0.9.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
builtins = ["__salt__", "__grains__", "__states__", "__opts__"]

[tool.basedpyright]
include = [
    "scripts",
    "states",
    "tests",
]
reportAny = false
reportImplicitStringConcatenation = false
reportMissingModuleSource = false
stubPath = "typings"
extraPaths = ["."]
venvPath = "."
venv = ".venv"
exclude = [
    ".venv",
    "run",
]

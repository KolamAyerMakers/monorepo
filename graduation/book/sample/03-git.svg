<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
  <title id="title">Git's staging area.</title>
   <desc id="desc">The staging area holds versions selected for the next commit, a snapshot in local history. In an existing repository whose last commit contains note.txt with hello, that version was staged, then edited and saved with an added again line. The current working file and the clerk's unchanged staged copy are labelled explicitly. The clerk's mind-reader joke is secondary. A prominent git add note.txt arrow updates the staging area to hello and again; the following page records this version with a complete commit command.</desc>
  <style>
    text { font-family: Chilanka, 'Liberation Sans', sans-serif; font-size: 5.2px; fill: #161616; }
    .title { font-size: 9px; }
    .code { font-family: 'Liberation Mono', monospace; font-size: 4.4px; }
    .small { font-size: 4.2px; }
    .ink { fill: none; stroke: #161616; stroke-width: .85; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: .55; }
  </style>
  <path fill="white" d="M0 0H210V148H0Z"/>
  <text x="12" y="18" class="title">GIT'S STAGING AREA.</text>
   <text x="14" y="28" class="small">Staging selects versions for the next commit: a snapshot in local history.</text>
   <text x="14" y="36" class="small">Here, the last commit's <tspan class="code" style="font-size:inherit">note.txt</tspan> contains <tspan class="code" style="font-size:inherit">hello</tspan>.</text>
   <text x="14" y="44" class="small">1. You staged that version with <tspan class="code" style="font-size:inherit">git add note.txt</tspan>.</text>
   <text x="14" y="52" class="small">2. You then edited and saved the file with <tspan class="code" style="font-size:inherit">again</tspan>. The staged copy did not change.</text>
   <text x="108" y="60" class="small">“I'm not a mind reader!”</text>
   <path class="ink thin" d="M134 63 Q132 65 133 69"/>
   <path class="ink" d="M31 72 C20 69 20 84 30 86 C41 88 43 73 31 72 Z M22 75 C18 71 21 67 25 69 C27 64 32 65 33 69 C38 66 42 70 40 74 M30 87 L30 103 M30 92 L45 84 M30 93 L20 100 M30 103 L21 113 M30 103 L39 113"/>
   <path fill="#fff0c9" d="M48 73 Q68 72 88 74 L87 99 Q67 101 48 99 Z"/><path class="ink thin" d="M48 73 Q68 72 88 74 L87 99 Q67 101 48 99 Z"/>
   <text x="53" y="83" class="code">hello</text><text x="53" y="93" class="code">again</text>
   <text x="47" y="110" class="small"><tspan class="code" style="font-size:inherit">note.txt</tspan> now</text>
   <path class="ink" d="M133 71 C123 68 121 83 132 86 C143 88 145 73 133 71 Z M125 73 Q133 68 141 75 M132 87 Q121 91 121 102 Q132 108 143 102 Q144 94 134 88 M134 93 L145 89 M124 94 L117 100 M128 106 L130 112 M136 106 L141 113 M117 91 V108 H141 M118 108 V114"/>
   <path fill="#def1e8" d="M147 74 Q167 73 191 75 L190 100 Q168 101 148 99 Z"/><path class="ink thin" d="M147 74 Q167 73 191 75 L190 100 Q168 101 148 99 Z"/>
   <text x="152" y="88" class="code">hello</text>
   <text x="146" y="110" class="small">staging area: old copy</text>
   <path class="ink thin" d="M12 118 Q100 116 197 118"/>
   <text x="14" y="130" class="code">git add note.txt</text>
   <text x="14" y="140" class="small">3. Now select the saved version.</text>
   <path class="ink" d="M82 129 H119 M113 125 L120 129 L113 133"/>
   <path fill="#def1e8" d="M128 122 H194 V140 H128 Z"/><path class="ink thin" d="M128 122 H194 V140 H128 Z"/>
   <text x="135" y="129" class="code">hello</text><text x="135" y="137" class="code">again</text>
   <text x="14" y="147" class="small">Commit on the next page.</text><text x="128" y="147" class="small">staging area: updated</text>
</svg>

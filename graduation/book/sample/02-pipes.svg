<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
  <title id="title">Pipes: connect commands.</title>
  <desc id="desc">An existing drinks.txt contains three lines: tea, tea, coffee. Three distinct workers illustrate cat reading the file, sort -u sorting and keeping unique lines, and wc -l counting lines. Paper panels show intermediate output streams, not extra files. The result is 2. Speech leaders stop clear of hair. A pipe connects stdout to the next command's stdin; stderr takes a separate route.</desc>
  <style>
    text { font-family: Chilanka, 'Liberation Sans', sans-serif; font-size: 5.2px; fill: #161616; }
    .title { font-size: 9px; }
    .code { font-family: 'Liberation Mono', monospace; font-size: 4.4px; }
    .small { font-size: 4.2px; }
    .ink { fill: none; stroke: #161616; stroke-width: .85; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: .55; }
  </style>
  <path fill="white" d="M0 0H210V148H0Z"/>
  <text x="12" y="18" class="title">PIPES: CONNECT COMMANDS.</text>
  <text x="14" y="29" class="small">Existing <tspan class="code" style="font-size:inherit">drinks.txt</tspan>: three lines, <tspan class="code" style="font-size:inherit">tea</tspan>, <tspan class="code" style="font-size:inherit">tea</tspan>, <tspan class="code" style="font-size:inherit">coffee</tspan>, each ending in a newline.</text>
  <text x="13" y="40">“Read the file.”</text>
  <text x="81" y="40">“Sort. No repeats.”</text>
  <text x="154" y="40">“Count lines.”</text>
  <path class="ink thin" d="M40 44 L36 47 M112 44 L116 49 M179 44 L184 47"/>
  <!-- Three deliberately different, loosely drawn workers. -->
  <path class="ink" d="M33 50 C24 47 24 63 32 65 C43 68 44 52 33 50 Z M26 56 Q29 53 32 56 Q31 61 27 60 Z M34 56 Q37 53 40 56 Q39 61 35 60 Z M32 57 H34 M32 66 Q34 77 32 88 M33 71 Q41 74 48 71 M33 74 L23 82 M32 88 L24 103 M32 88 L39 103"/>
   <path class="ink" d="M102 49 C92 47 91 62 101 64 C112 64 112 49 102 49 Z M95 50 Q100 46 105 49 M99 47 C96 43 103 42 105 46 M101 64 Q101 76 99 87 M101 72 Q91 75 88 72 M101 73 Q108 76 116 72 M99 87 L92 103 M99 87 L108 103 M100 66 Q93 71 93 85 L106 87 Q108 75 102 67"/>
  <path class="ink" d="M171 52 C162 49 159 64 169 67 C180 70 183 53 171 52 Z M162 63 Q157 48 171 49 Q186 51 183 69 L180 73 M162 63 L159 70 M170 68 Q168 81 170 90 M169 74 L158 80 M169 76 Q177 81 181 76 M170 90 L162 104 M170 90 L177 104"/>
  <!-- Lists travel along rough paper chutes between the workers. -->
  <path fill="#fff0c9" d="M47 57 Q61 56 81 58 L82 84 Q66 86 47 83 Z"/>
  <path fill="#def1e8" d="M118 63 Q132 61 148 64 L147 84 Q130 86 118 83 Z"/>
  <text x="48" y="53" class="small">output</text><text x="121" y="57" class="small">output</text>
  <path class="ink thin" d="M47 57 Q61 56 81 58 L82 84 Q66 86 47 83 Z M118 63 Q132 61 148 64 L147 84 Q130 86 118 83 Z"/>
  <text x="52" y="65" class="code">tea</text><text x="52" y="72" class="code">tea</text><text x="52" y="79" class="code">coffee</text>
  <text x="121" y="71" class="code">coffee</text><text x="121" y="79" class="code">tea</text>
  <path class="ink" d="M83 79 L89 79 M86 76 L90 79 L86 82 M150 79 L156 79 M153 76 L157 79 L153 82"/>
  <path class="ink thin" d="M182 64 L196 65 L195 84 L181 83 Z"/>
  <text x="185" y="78" class="code" style="font-size:7px">2</text>
  <text x="14" y="112" class="code">cat drinks.txt</text><text x="69" y="112" class="code">|</text><text x="87" y="112" class="code">sort -u</text><text x="140" y="112" class="code">|</text><text x="160" y="112" class="code">wc -l</text>
  <path class="ink thin" d="M12 119 Q65 118 104 120 Q162 118 197 119"/>
  <text x="14" y="129" class="small"><tspan class="code" style="font-size:inherit">|</tspan> sends <tspan class="code" style="font-size:inherit">stdout</tspan> into the next command's <tspan class="code" style="font-size:inherit">stdin</tspan>. Paper here shows streams, not saved files.</text>
  <text x="14" y="140" class="small"><tspan class="code" style="font-size:inherit">sort -u</tspan> keeps sorted unique lines; <tspan class="code" style="font-size:inherit">wc -l</tspan> counts lines. <tspan class="code" style="font-size:inherit">stderr</tspan> does not follow <tspan class="code" style="font-size:inherit">|</tspan>.</text>
</svg>

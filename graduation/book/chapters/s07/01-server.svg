<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
<title id="title">HTTP clients and servers.</title><desc id="desc">A browser or curl is an HTTP client: it requests a resource. A server is a running program that answers. A concrete diagram shows a client requesting the root page with GET / and a server returning an illustrative 200 response and page body. These roles are programs, not special types of computer.</desc>
<style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.2px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
<path fill="white" d="M0 0H210V148H0Z"/><text x="12" y="14" class="small">HTTP REQUESTS AND RESPONSES / 01</text><text x="12" y="28" class="title">HTTP CLIENTS AND SERVERS.</text>
<text x="14" y="42" class="small">A client requests a resource: a browser or <tspan class="code" style="font-size:inherit">curl</tspan> can request a web page.</text>
<text x="14" y="52" class="small">A server is a running program that answers requests, not a special computer.</text>
<path fill="#fff0c9" d="M16 68 H66 V111 H16 Z"/><path fill="#def1e8" d="M145 68 H195 V111 H145 Z"/>
<path class="ink" d="M16 68 Q42 67 66 68 V111 H16 Z M145 68 Q170 67 195 68 V111 H145 Z M73 82 H136 M130 78 L137 82 L130 86 M137 101 H74 M80 97 L73 101 L80 105"/>
<text x="22" y="82">client</text><text x="22" y="94" class="small">browser / <tspan class="code" style="font-size:inherit">curl</tspan></text><text x="22" y="104" class="small">on your computer</text>
<text x="151" y="82">server</text><text x="151" y="94" class="small">HTTP program</text><text x="151" y="104" class="small">has page data</text>
<text x="82" y="73" class="code">GET /</text><text x="84" y="93" class="code">200 + page</text>
<text x="14" y="124" class="small">Illustrative exchange: <tspan class="code" style="font-size:inherit">GET</tspan> asks for a resource; <tspan class="code" style="font-size:inherit">/</tspan> is the URL's root path.</text>
<text x="14" y="135" class="small">The reply has a status, headers and usually a body: the returned page data.</text>
<text x="14" y="145" class="small">The next pages show requests and responses; a real server can answer with an error.</text>
</svg>

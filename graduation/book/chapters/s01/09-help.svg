<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
  <title id="title">Show the command and the error.</title>
  <desc id="desc">On the example computer /etc/hostname exists. Command and error output are labelled separately: cat /etc/hosntame fails because its filename is mistyped. The corrected command is cat /etc/hostname. A padded highlight emphasizes exact.</desc>
  <style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
  <path fill="white" d="M0 0H210V148H0Z"/>
  <text x="12" y="14" class="small">TERMINAL AND COMMANDS / 04</text><text x="12" y="28" class="title">SHOW THE COMMAND AND THE ERROR.</text>
  <path fill="#def1e8" d="M16 70 H20 V101 H16 Z"/>
  <path fill="#fff0c9" d="M28 127 H44 V136 H28 Z"/>
  <path class="ink" d="M15 39 Q80 38 192 40 L191 58 L15 57 Z M15 69 Q82 67 192 69 L191 103 L14 102 Z"/>
  <text x="22" y="51">“It doesn't work.”</text><text x="128" y="51" class="small">…which bit?</text>
  <text x="14" y="65" class="small">Here, <tspan class="code" style="font-size:inherit">/etc/hostname</tspan> exists on this computer.</text>
  <text x="22" y="78" class="small">typed command:</text><text x="65" y="78" class="code">cat /etc/hosntame</text>
  <text x="22" y="87" class="small">error output:</text>
  <text x="22" y="97" class="code">cat: /etc/hosntame: No such file or directory</text>
  <text x="14" y="115" class="small">Corrected command: <tspan class="code" style="font-size:inherit">cat /etc/hostname</tspan> (the filename was mistyped).</text>
  <path class="ink thin" d="M12 123 Q100 121 197 123"/>
  <text x="14" y="134">The</text><text x="30" y="134">exact</text><text x="46" y="134">command and message help someone find the problem.</text>
  <text x="14" y="143" class="small">An error is useful information. Read it before changing something else.</text>
</svg>

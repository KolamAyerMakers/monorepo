<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
  <title id="title">Check user, computer and time.</title>
  <desc id="desc">Four commands show explicitly illustrative output for the current account, machine name, date and uptime. The uptime sample reports 2 hours 15 minutes since startup, current time, one logged-in user and three recent load averages. Results describe the computer running the commands.</desc>
  <style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.8px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
  <path fill="white" d="M0 0H210V148H0Z"/>
   <text x="12" y="14" class="small">TERMINAL AND COMMANDS / 02</text><text x="12" y="28" class="title">CHECK USER, COMPUTER AND TIME.</text>
  <text x="12" y="45" class="small">Illustrative output:</text>
  <path fill="#fff0c9" d="M79 45 H119 V56 H79 Z"/>
  <path fill="#def1e8" d="M140 45 H192 V56 H140 Z"/>
   <g class="ink" transform="translate(34 63)"><path d="M0 0 C-10 -3 -11 13 -1 16 C10 18 12 2 0 0 Z M-10 9 Q-14 -4 0 -4 Q15 -3 13 12 L10 18 M-10 9 L-12 17 M-1 17 Q-3 29 -1 38 M0 24 L15 20 M0 27 L-10 35 M-1 38 L-10 50 M-1 38 L7 50 M-1 18 Q-10 22 -9 37 Q-2 41 7 37 Q8 26 2 19"/></g>
  <path class="ink thin" d="M76 42 Q97 40 121 42 L122 69 L76 68 Z M137 41 Q162 42 195 41 L194 69 L137 68 Z"/>
  <text x="80" y="53" class="code">whoami</text><text x="80" y="64" class="code" style="font-size:4px">maya</text>
  <text x="142" y="53" class="code">hostname</text><text x="142" y="64" class="code" style="font-size:4px">home-pc</text>
  <text x="77" y="91" class="code">date</text><text x="77" y="102" class="code" style="font-size:4px">Sat Oct 3 10:30:00 UTC 2026</text>
  <text x="14" y="125" class="code">uptime</text><text x="40" y="125" class="code" style="font-size:4px">10:30:00 up 2:15, 1 user, load average: 0.10, 0.20, 0.15</text>
   <text x="77" y="77" class="small">account (user identity)</text><text x="139" y="77" class="small">computer's name</text>
   <text x="77" y="112" class="small">system date, time and time zone; yours will differ</text>
   <text x="14" y="136" class="small">Here: 2 hours, 15 minutes since startup; 1 logged-in user.</text>
   <text x="14" y="145" class="small">Also current time and load averages: recent system demand over 1, 5 and 15 minutes.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
  <title id="title">ssh: open a remote terminal.</title>
  <desc id="desc">A person uses SSH to send commands from a laptop terminal to a remote shell and receive output. The prominent command uses placeholder account and destination values. SSH requires a client, a reachable server and an allowed login. Verify a new host fingerprint through a trusted source and investigate changed-host warnings. exit returns to the local shell.</desc>
  <style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:8.5px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.2px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
  <path fill="white" d="M0 0H210V148H0Z"/>
   <text x="12" y="14" class="small">REMOTE TERMINALS WITH SSH / 01</text>
  <text x="12" y="28" class="title"><tspan class="code" style="font-size:inherit">ssh</tspan>: OPEN A REMOTE TERMINAL.</text>
  <text x="14" y="40" class="small">SSH carries commands and output securely between computers.</text>
  <path fill="#def1e8" d="M14 45 H196 V59 H14 Z"/>
  <text x="20" y="54" class="code">ssh user@server</text><text x="75" y="54" class="small">your account and destination, not supplied values</text>
  <g class="ink" transform="translate(25 64)">
    <path d="M0 0 C-10 -3 -11 13 -1 16 C10 18 12 2 0 0 Z M-8 5 Q-4 2 -1 5 Q-2 10 -6 9 Z M2 5 Q6 2 9 5 Q8 10 4 9 Z M-1 6 H2 M-1 17 Q1 28 -1 38 M0 24 L15 29 M0 27 L-10 35 M-1 38 L-10 50 M-1 38 L7 50"/>
  </g>
  <path class="ink" d="M48 73 Q67 72 85 74 L86 96 L48 95 Z M43 99 Q66 100 91 98 L87 103 L46 104 Z"/>
  <text x="52" y="83" class="small">terminal</text><text x="53" y="91" class="code">ls</text>
  <path class="ink thin" d="M92 79 H136 M130 75 L137 79 L130 83 M137 96 H93 M99 92 L92 96 L99 100"/>
  <text x="96" y="72" class="small">commands</text><text x="104" y="90" class="small">output</text>
  <path class="ink" d="M144 66 Q165 64 190 67 L189 105 Q166 107 143 104 Z"/>
  <text x="151" y="80" class="small">remote shell</text><text x="151" y="94" class="small">remote files</text>
  <text x="46" y="113" class="small">your laptop</text><text x="147" y="113" class="small">remote computer</text>
  <text x="14" y="123" class="small">Needs an SSH client here, a reachable SSH server there, and an allowed login.</text>
  <text x="14" y="131" class="small">A fingerprint identifies the server's key; verify it via a trusted source before accepting.</text>
  <text x="14" y="139" class="small">Changed-host warning? Investigate; don't bypass it.</text>
  <text x="14" y="147" class="small"><tspan class="code" style="font-size:inherit">exit</tspan> ends the remote shell and returns to your local shell.</text>
</svg>

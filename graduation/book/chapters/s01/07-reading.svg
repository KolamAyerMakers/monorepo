<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
  <title id="title">Read a text file.</title>
  <desc id="desc">The existing text file note.txt is pictured as eleven lines. Complete head and tail commands select its first and last five lines. less note.txt allows scrolling with arrow keys and q to quit; cat note.txt prints the whole file. less may need installation.</desc>
  <style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.4px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
  <path fill="white" d="M0 0H210V148H0Z"/>
  <text x="12" y="14" class="small">FILES AND PATHS / 06</text><text x="12" y="28" class="title">READ A TEXT FILE.</text>
  <path fill="#def1e8" d="M84 44 Q104 43 129 45 L128 73 L84 72 Z"/>
  <path fill="#ece5f5" d="M84 81 Q103 80 128 82 L128 110 L84 109 Z"/>
  <path class="ink" d="M80 39 Q108 38 134 40 L133 114 Q109 116 79 113 Z"/>
  <path class="ink thin" d="M88 47 H125 M87 53 H126 M88 59 H124 M87 65 H126 M88 71 H125 M88 77 H124 M87 83 H126 M88 89 H125 M87 95 H124 M88 101 H126 M88 107 H125"/>
  <path class="ink" d="M76 45 H71 V73 H76 M139 68 H145 V89 H139 M76 81 H71 V109 H76"/>
  <text x="15" y="53" class="code">head -n 5 note.txt</text><text x="20" y="63" class="small">first 5 lines</text>
  <text x="149" y="75" class="code">less note.txt</text><text x="149" y="85" class="small">arrow keys: scroll</text><text x="149" y="95" class="small"><tspan class="code" style="font-size:inherit">q</tspan>: quit</text>
  <text x="15" y="102" class="code">tail -n 5 note.txt</text><text x="20" y="112" class="small">last 5 lines</text>
  <text x="85" y="35" class="small"><tspan class="code" style="font-size:inherit">note.txt</tspan> exists</text>
  <text x="14" y="124" class="code">cat note.txt</text><text x="53" y="124" class="small">prints the whole file.</text>
  <path class="ink thin" d="M12 130 Q100 128 197 130"/>
  <text x="14" y="141" class="small"><tspan class="code" style="font-size:inherit">less</tspan> missing? See Package Management / 01–02.</text>
</svg>

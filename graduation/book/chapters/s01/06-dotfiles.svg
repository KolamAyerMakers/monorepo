<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
  <title id="title">Hidden files: names that start with a dot.</title>
  <desc id="desc">note.txt and .note.txt stand beside each other. Names starting with a dot are normally left out of ls; ls -a includes them. Anyone with permission to read a hidden file can still read it. Renaming a file with a leading dot does not encrypt it or restrict access.</desc>
  <style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.4px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
  <path fill="white" d="M0 0H210V148H0Z"/>
  <text x="12" y="14" class="small">FILES AND PATHS / 03</text><text x="12" y="28" class="title">HIDDEN FILES START WITH A DOT.</text>
  <text x="15" y="44"><tspan class="code" style="font-size:inherit">ls</tspan> normally omits names starting with a dot.</text>
  <path fill="#ece5f5" d="M129 60 L161 61 L170 71 L169 95 L130 94 Z"/>
  <g class="ink" transform="translate(33 58)"><path d="M0 0 C-10 -3 -11 13 -1 16 C10 18 12 2 0 0 Z M-9 3 Q-1 -6 8 2 M8 3 Q18 1 17 9 Q11 9 13 19 M-1 17 Q1 28 -1 38 M0 24 L14 18 M0 27 L-10 35 M-1 38 L-10 50 M-1 38 L7 50"/></g>
  <path class="ink" d="M66 60 L96 59 L106 69 L105 94 L66 93 Z M96 59 L95 70 L106 69 M129 60 L161 61 L170 71 L169 95 L130 94 Z M161 61 L160 71 L170 71"/>
  <text x="68" y="83" class="code">note.txt</text><text x="131" y="83" class="code">.note.txt</text>
  <text x="66" y="106" class="small">ordinary name</text><text x="129" y="106" class="small">hidden name</text>
  <text x="19" y="120" class="code">ls</text><text x="30" y="120" class="small">lists ordinary names</text>
  <text x="112" y="120" class="code">ls -a</text><text x="131" y="120" class="small">also lists hidden names</text>
  <path class="ink thin" d="M12 128 Q100 126 197 128"/>
  <text x="14" y="139" class="small">Hidden files can still be read by anyone who has permission to read them.</text>
</svg>

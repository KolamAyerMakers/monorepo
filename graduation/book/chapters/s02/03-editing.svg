<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
  <title id="title">Edit and save a text file.</title><desc id="desc">With nano installed and note.txt not yet present, nano note.txt opens a new editing buffer. Type hello; Ctrl-O then Enter saves note.txt on disk. An adjacent warning states that saving an existing file replaces its contents. Ctrl-X exits; ^O means Ctrl plus letter O.</desc>
  <style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.4px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
  <path fill="white" d="M0 0H210V148H0Z"/>
  <text x="12" y="14" class="small">FILES AND PATHS / 10</text><text x="12" y="28" class="title">EDIT AND SAVE A TEXT FILE.</text>
  <text x="14" y="40" class="small"><tspan class="code" style="font-size:inherit">nano</tspan> installed; <tspan class="code" style="font-size:inherit">note.txt</tspan> does not exist yet.</text>
  <text x="14" y="49" class="code">nano note.txt</text><text x="60" y="49" class="small">opens a new file; type <tspan class="code" style="font-size:inherit">hello</tspan>.</text>
  <path fill="#fff0c9" d="M19 56 L78 55 L79 91 L18 90 Z"/><path fill="#def1e8" d="M140 57 L181 56 L190 66 L189 91 L139 90 Z"/>
  <path class="ink" d="M19 56 L78 55 L79 91 L18 90 Z M20 65 H76 M140 57 L181 56 L190 66 L189 91 L139 90 Z M181 56 L180 67 L190 66"/>
  <text x="25" y="63" class="code">nano</text><text x="27" y="82" class="code">hello</text><text x="146" y="81" class="code">hello</text>
  <text x="23" y="103" class="small">text you're editing</text><text x="143" y="103" class="small"><tspan class="code" style="font-size:inherit">note.txt</tspan> after saving</text>
  <path class="ink" d="M86 83 Q107 82 131 83 M125 79 L132 83 L125 87"/>
  <text x="89" y="63" class="code">Ctrl-O</text><text x="88" y="72" class="small">then <tspan class="code" style="font-size:inherit">Enter</tspan></text>
  <text x="14" y="115" class="small">Warning: saving an existing file replaces its previous contents.</text>
  <path class="ink thin" d="M12 123 Q100 121 197 123"/>
  <text x="14" y="134" class="small"><tspan class="code" style="font-size:inherit">Ctrl-O</tspan> starts saving; <tspan class="code" style="font-size:inherit">Enter</tspan> confirms the filename; <tspan class="code" style="font-size:inherit">Ctrl-X</tspan> quits.</text>
  <text x="14" y="144" class="small"><tspan class="code" style="font-size:inherit">^O</tspan> means hold <tspan class="code" style="font-size:inherit">Ctrl</tspan> and press the letter <tspan class="code" style="font-size:inherit">O</tspan> (not zero).</text>
</svg>

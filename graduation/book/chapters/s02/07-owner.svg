<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
  <title id="title">Who owns this file?</title><desc id="desc">Every file has an owner, a user account. An example ls -l note.txt listing highlights maya as owner. A plain file outline has a factual owner label, not legs or a personality. Permissions control access separately from ownership. Other listing columns are not taught here.</desc>
  <style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
  <path fill="white" d="M0 0H210V148H0Z"/>
  <text x="12" y="14" class="small">OWNERSHIP AND PERMISSIONS / 01</text><text x="12" y="28" class="title">WHO OWNS THIS FILE?</text>
  <text x="14" y="41">Every file has an owner: a user account.</text>
  <text x="14" y="53" class="code">ls -l note.txt</text><text x="57" y="53" class="small">example output for an existing file:</text>
  <path fill="#fff0c9" d="M44 57 H56 V67 H44 Z"/>
  <text x="14" y="65" class="code">-rw-r--r-- 1 maya users 6 Oct 3 10:00 note.txt</text>
  <path class="ink thin" d="M50 70 V77"/>
  <text x="37" y="85" class="small">owner</text>
  <path fill="#fff0c9" d="M138 77 L175 76 L185 87 L183 109 L137 108 Z"/>
  <path class="ink" d="M138 77 L175 76 L185 87 L183 109 L137 108 Z M175 76 L174 87 L185 87"/>
  <text x="145" y="101" class="small">owner: maya</text>
  <text x="14" y="104">This file belongs to user maya.</text>
  <path class="ink thin" d="M12 125 Q100 123 197 125"/>
  <text x="14" y="136">Permissions say who may read or change the file.</text>
  <text x="14" y="145" class="small">The owner is not necessarily the only person with access.</text>
</svg>

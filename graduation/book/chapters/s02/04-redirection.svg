<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
  <title id="title">Redirect output: replace, append or discard.</title><desc id="desc">Two alternative examples each start with note.txt containing a line hello. echo prints again followed by a newline. Single greater-than replaces the file; double greater-than appends. Both before and after contents are shown with arrows. A compact third destination explains that /dev/null discards output rather than saving it.</desc>
  <style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.2px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
  <path fill="white" d="M0 0H210V148H0Z"/>
  <text x="12" y="14" class="small">STREAMS AND PIPES / 02</text><text x="12" y="28" class="title">WRITE OUTPUT TO A FILE.</text>
  <text x="14" y="40" class="small">Redirection sends <tspan class="code" style="font-size:inherit">stdout</tspan> to a destination instead of the screen.</text>
  <text x="14" y="50" class="small"><tspan class="code" style="font-size:inherit">echo</tspan> prints text plus a newline. Each example starts with <tspan class="code" style="font-size:inherit">hello</tspan> in <tspan class="code" style="font-size:inherit">note.txt</tspan>.</text>
  <text x="14" y="63" class="code">echo again &gt; note.txt</text><text x="112" y="63" class="code">echo again &gt;&gt; note.txt</text>
  <text x="14" y="73" class="small">WARNING: replaces old contents.</text><text x="112" y="73" class="small">Appends: adds a line at the end.</text>
  <text x="14" y="85" class="small">before</text><text x="65" y="85" class="small">after</text><text x="112" y="85" class="small">before</text><text x="164" y="85" class="small">after</text>
  <path fill="#f8e0dc" d="M63 89 H94 V115 H63 Z"/><path fill="#def1e8" d="M162 89 H195 V115 H162 Z"/>
  <path class="ink thin" d="M14 89 H44 V115 H14 Z M63 89 H94 V115 H63 Z M112 89 H142 V115 H112 Z M162 89 H195 V115 H162 Z"/>
  <text x="17" y="104" class="code">hello</text><text x="66" y="104" class="code">again</text><text x="115" y="104" class="code">hello</text><text x="165" y="100" class="code">hello</text><text x="165" y="110" class="code">again</text>
  <path class="ink" d="M48 102 H58 M53 98 L59 102 L53 106 M146 102 H157 M152 98 L158 102 L152 106"/>
  <path class="ink thin" d="M12 123 Q100 121 197 123"/>
  <text x="14" y="135" class="code">echo again &gt;/dev/null</text><text x="79" y="135" class="small">discards output; saves no file.</text>
  <text x="14" y="145" class="small"><tspan class="code" style="font-size:inherit">/dev/null</tspan> is a special destination that throws away bytes.</text>
</svg>

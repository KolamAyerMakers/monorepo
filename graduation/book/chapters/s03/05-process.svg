<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
<title id="title">Programs and running processes.</title><desc id="desc">One program is instructions in a file; a process is one running instance. Two independent arrows labelled launch 1 and launch 2 show running sleep 60 separately, producing two processes with illustrative process IDs. There is no fork-shaped launch arrow. A complete ps command selects the current account using $(id -un), which inserts the account name, and shows labelled process ID, program name and command-line columns.</desc>
<style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.2px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
<path fill="white" d="M0 0H210V148H0Z"/><text x="12" y="14" class="small">PROCESSES AND SIGNALS / 01</text><text x="12" y="28" class="title">PROGRAMS AND RUNNING PROCESSES.</text>
<text x="14" y="40" class="small">Program = instructions in a file. Process = one running instance.</text>
<text x="14" y="48" class="small"><tspan class="code" style="font-size:inherit">sleep 60</tspan> waits 60 seconds; these launches overlap in separate terminals.</text>
<path fill="#fff0c9" d="M20 58 L58 57 L67 67 L66 91 L19 90 Z"/><path class="ink" d="M20 58 L58 57 L67 67 L66 91 L19 90 Z"/>
<text x="24" y="77" class="code">sleep</text><text x="20" y="101" class="small">one program file</text>
<text x="78" y="54" class="small">launch 1: <tspan class="code" style="font-size:inherit">sleep 60</tspan></text><text x="78" y="84" class="small">launch 2: <tspan class="code" style="font-size:inherit">sleep 60</tspan></text>
<path class="ink" d="M72 64 H129 M123 60 L130 64 L123 68 M72 94 H129 M123 90 L130 94 L123 98"/>
<path fill="#def1e8" d="M137 56 H194 V76 H137 Z"/><path fill="#ece5f5" d="M137 86 H194 V106 H137 Z"/>
<text x="142" y="64" class="small">process ID (PID)</text><text x="142" y="73" class="code">412</text><text x="142" y="94" class="small">process ID (PID)</text><text x="142" y="103" class="code">587</text>
<text x="14" y="114" class="small">Two separate launches. These IDs are examples, not IDs to copy.</text>
<text x="14" y="126" class="code">ps -u "$(id -un)" -o pid,comm,args</text>
<text x="14" y="136" class="small"><tspan class="code" style="font-size:inherit">$(id -un)</tspan> inserts your account name; <tspan class="code" style="font-size:inherit">ps -u</tspan> selects its processes.</text>
<text x="14" y="145" class="small">Columns: <tspan class="code" style="font-size:inherit">pid</tspan> = ID; <tspan class="code" style="font-size:inherit">comm</tspan> = program name; <tspan class="code" style="font-size:inherit">args</tspan> = command line.</text>
</svg>

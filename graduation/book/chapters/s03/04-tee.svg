<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
<title id="title">tee: copy output to a file and the screen.</title><desc id="desc">date sends output through tee, which copies the same bytes to today.txt and standard output, here the terminal. The illustrative date Sat Oct 3 10:00:00 UTC 2026 appears at input and both destinations. A nearby warning explains replacement; a complete date pipe tee -a today.txt pipeline appends instead.</desc>
<style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.2px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
<path fill="white" d="M0 0H210V148H0Z"/><text x="12" y="14" class="small">STREAMS AND PIPES / 06</text><text x="12" y="28" class="title"><tspan class="code" style="font-size:inherit">tee</tspan>: COPY OUTPUT TO FILE AND SCREEN.</text>
<text x="14" y="40" class="small"><tspan class="code" style="font-size:inherit">tee</tspan> copies its input into a file and passes the same bytes to <tspan class="code" style="font-size:inherit">stdout</tspan>.</text>
<text x="14" y="51" class="code" style="font-size:5px">date | tee today.txt</text>
<text x="14" y="61" class="small">WARNING: replaces <tspan class="code" style="font-size:inherit">today.txt</tspan> if it exists. Example date below; yours differs.</text>
<text x="14" y="79" class="code">Sat Oct 3 10:00:00 UTC 2026</text><text x="14" y="89" class="small">output from <tspan class="code" style="font-size:inherit">date</tspan></text>
<path fill="#def1e8" d="M31 100 H58 V115 H31 Z"/><path class="ink" d="M31 100 H58 V115 H31 Z M44 91 V97 M40 93 L44 98 L48 93 M64 107 H81 M81 107 V83 H99 M93 79 L100 83 L93 87 M81 107 V116 H99 M93 112 L100 116 L93 120"/>
<text x="39" y="110" class="code">tee</text>
<text x="105" y="76" class="small">terminal: <tspan class="code" style="font-size:inherit">stdout</tspan></text><text x="105" y="86" class="code">Sat Oct 3 10:00:00 UTC 2026</text>
<text x="105" y="108" class="code">today.txt</text><text x="105" y="118" class="code">Sat Oct 3 10:00:00 UTC 2026</text>
<path class="ink thin" d="M12 127 Q100 125 197 127"/>
<text x="14" y="140" class="code">date | tee -a today.txt</text><text x="83" y="140" class="small">appends; keeps the old contents.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
<title id="title">Bash quotes keep one argument together.</title><desc id="desc">A variable is a name holding a value; an argument is one value passed to a command. The Bash variable name holds Ada Lovelace. Quoted expansion passes one argument to printf, while unquoted expansion passes two in this example. Labelled output panels show the difference. A full printf command with single-quoted $name prints the literal text $name.</desc>
<style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.1px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
<path fill="white" d="M0 0H210V148H0Z"/><text x="12" y="14" class="small">BASH SCRIPTS / 02</text><text x="12" y="28" class="title">BASH QUOTES AND ARGUMENTS.</text>
<text x="14" y="39" class="small">A variable holds a named value. An argument is one value passed to a command.</text>
<text x="14" y="50" class="code">name="Ada Lovelace"</text>
<text x="14" y="60" class="small"><tspan class="code" style="font-size:inherit">name</tspan> stores text; <tspan class="code" style="font-size:inherit">$name</tspan> retrieves it. No spaces around <tspan class="code" style="font-size:inherit">=</tspan>.</text>
<text x="14" y="73" class="small">quoted: one name argument</text><text x="114" y="73" class="small">unquoted: two name arguments</text>
<text x="14" y="83" class="code">printf '&lt;%s&gt;\n' "$name"</text><text x="114" y="83" class="code">printf '&lt;%s&gt;\n' $name</text>
<path fill="#def1e8" d="M15 88 H101 V111 H15 Z"/><path fill="#f8e0dc" d="M114 88 H194 V111 H114 Z"/><path class="ink thin" d="M15 88 H101 V111 H15 Z M114 88 H194 V111 H114 Z"/>
<text x="20" y="102" class="code">&lt;Ada Lovelace&gt;</text><text x="120" y="98" class="code">&lt;Ada&gt;</text><text x="120" y="107" class="code">&lt;Lovelace&gt;</text>
<text x="14" y="120" class="small">Output above: <tspan class="code" style="font-size:inherit">%s</tspan> inserts text; <tspan class="code" style="font-size:inherit">\n</tspan> adds a new line.</text>
<text x="14" y="130" class="small">Double quotes keep the value together. Single quotes keep literal text:</text>
<text x="14" y="143" class="code">printf '%s\n' '$name'</text><path class="ink" d="M72 142 H107 M101 138 L108 142 L101 146"/><text x="119" y="143" class="code">$name</text><text x="139" y="143" class="small">literal output</text>
</svg>

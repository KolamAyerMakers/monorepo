<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
<title id="title">Bash if chooses a branch.</title><desc id="desc">A regular file stores contents, unlike a directory. In Bash, [ -f note.txt ] tests whether note.txt is a regular file. The true branch prints found; the false branch prints not a regular file, rather than falsely claiming the path is missing. Arrows connect each printf branch to its labelled terminal output. Zero test exit status selects the true branch.</desc>
<style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.2px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
<path fill="white" d="M0 0H210V148H0Z"/><text x="12" y="14" class="small">BASH SCRIPTS / 04</text><text x="12" y="28" class="title"><tspan class="code" style="font-size:inherit">if</tspan> CHOOSES WHAT HAPPENS NEXT.</text>
<text x="14" y="39" class="small">A regular file stores contents, unlike a directory.</text>
<text x="14" y="48" class="small">Bash test: is <tspan class="code" style="font-size:inherit">note.txt</tspan> a regular file?</text>
<text x="17" y="60" class="code">if [ -f note.txt ]; then</text><text x="17" y="73" class="code">  printf 'found\n'</text><text x="17" y="86" class="code">else</text><text x="17" y="99" class="code">  printf 'not a regular file\n'</text><text x="17" y="112" class="code">fi</text>
<text x="132" y="52" class="small">terminal output</text><text x="132" y="63" class="small">yes</text><text x="132" y="93" class="small">no</text>
<path fill="#def1e8" d="M132 66 H194 V81 H132 Z"/><path fill="#f8e0dc" d="M132 96 H194 V111 H132 Z"/>
<path class="ink" d="M110 72 H125 M119 68 L126 72 L119 76 M110 103 H125 M119 99 L126 103 L119 107"/>
<text x="136" y="76" class="code">found</text><text x="136" y="106" class="code">not a regular file</text>
<path class="ink thin" d="M12 120 Q100 118 197 120"/><text x="14" y="130" class="small"><tspan class="code" style="font-size:inherit">if</tspan> follows the test's exit status: 0 selects yes; nonzero selects no.</text>
<text x="14" y="140" class="small">Keep spaces around <tspan class="code" style="font-size:inherit">[</tspan> and <tspan class="code" style="font-size:inherit">]</tspan>. The test doesn't check the contents.</text>
</svg>

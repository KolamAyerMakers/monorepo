<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
<title id="title">systemd: separate system and user managers.</title><desc id="desc">A service is a program supervised by a manager. Separate arrows connect the system manager, PID 1, to system services and the user's manager to user services. systemctl --user selects the latter scope. Two prerequisite commands have clearly illustrative output, not a promise that systemd or a user manager exists.</desc>
<style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.2px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
<path fill="white" d="M0 0H210V148H0Z"/><text x="12" y="14" class="small">SERVICES AND TROUBLESHOOTING / 01</text><text x="12" y="28" class="title"><tspan class="code" style="font-size:inherit">systemd</tspan>: TWO MANAGER SCOPES.</text>
<text x="14" y="40" class="small">A service is a program a manager starts, stops and supervises.</text>
<path fill="#ece5f5" d="M16 48 H98 V68 H16 Z"/><path fill="#def1e8" d="M114 48 H195 V68 H114 Z"/>
<text x="21" y="57">system manager</text><text x="21" y="65" class="small">PID 1: process number 1</text><text x="119" y="57">your user manager</text><text x="119" y="65" class="small">a separate process</text>
<path class="ink" d="M57 71 V80 M53 75 L57 81 L61 75 M154 71 V80 M150 75 L154 81 L158 75"/>
<text x="30" y="91" class="small">system services</text><text x="133" y="91" class="small">your services</text>
<text x="14" y="104" class="code">ps -p 1 -o comm=</text><text x="97" y="104" class="small">illustrative output: <tspan class="code" style="font-size:inherit">systemd</tspan></text>
<text x="14" y="116" class="code">systemctl --user status</text><text x="97" y="116" class="small">selected output: <tspan class="code" style="font-size:inherit">State: running</tspan></text>
<text x="14" y="127" class="small"><tspan class="code" style="font-size:inherit">--user</tspan> talks to your user manager, not the system manager.</text>
<text x="14" y="137" class="small">This chapter needs <tspan class="code" style="font-size:inherit">systemd</tspan> AND a reachable user manager; check, don't assume.</text>
<text x="14" y="146" class="small">Common on full Debian/Ubuntu/Fedora installs; minimal systems may differ.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
<title id="title">Start and enable change independent service states.</title><desc id="desc">For the prepared user unit web-demo.service, verification and daemon reload are prerequisites. Separate arrows show start and stop changing running state, while enable and disable change future user-manager startup registration without changing running state. A complete restart command applies edits after verification and reload. Enabling does not establish boot or logout availability.</desc>
<style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:3.9px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
<path fill="white" d="M0 0H210V148H0Z"/><text x="12" y="14" class="small">SERVICES AND TROUBLESHOOTING / 04</text><text x="12" y="28" class="title">STARTING AND ENABLING A SERVICE.</text>
<text x="14" y="39" class="small">Prepared <tspan class="code" style="font-size:inherit">web-demo.service</tspan>, user manager. Verify rules, not page contents:</text>
<text x="14" y="49" class="code">systemd-analyze --user verify ~/.config/systemd/user/web-demo.service</text>
<text x="14" y="59" class="code">systemctl --user daemon-reload</text><text x="112" y="59" class="small">then reread unit definitions</text>
<path fill="#def1e8" d="M139 64 H195 V94 H139 Z"/><path fill="#ece5f5" d="M139 96 H195 V126 H139 Z"/>
<text x="143" y="70" class="small">running now</text><text x="143" y="80" class="small">off → on</text><text x="143" y="90" class="small">on → off</text>
<text x="14" y="74" class="code">systemctl --user start web-demo.service</text><text x="14" y="86" class="code">systemctl --user stop web-demo.service</text>
<path class="ink" d="M118 73 H134 M129 69 L135 73 L129 77 M118 85 H134 M129 81 L135 85 L129 89"/>
<text x="143" y="102" class="small">startup later</text><text x="143" y="112" class="small">off → on</text><text x="143" y="122" class="small">on → off</text>
<text x="14" y="106" class="code">systemctl --user enable web-demo.service</text><text x="14" y="118" class="code">systemctl --user disable web-demo.service</text>
<path class="ink" d="M118 105 H134 M129 101 L135 105 L129 109 M118 117 H134 M129 113 L135 117 L129 121"/>
<text x="14" y="132" class="small">Startup later = when your manager starts. It does not change running or logout state.</text>
<text x="14" y="142" class="code">systemctl --user restart web-demo.service</text><text x="112" y="142" class="small">apply edits after the steps above</text>
</svg>

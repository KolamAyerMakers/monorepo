<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
<title id="title">Wildcards: the shell supplies matching filenames.</title>
<desc id="desc">With a.txt, b.txt and photo.jpg in the current directory, Bash expands star dot txt into the two matching filenames before printf runs. The output has one filename per line. Quoting the pattern prints its literal text. Default Bash no-match and dotfile behaviour are stated.</desc>
<style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:4.4px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
<text x="12" y="14" class="small">FILES AND PATHS / 05</text><text x="12" y="28" class="title">WILDCARDS PICK FILENAMES.</text>
<text x="14" y="39">A wildcard pattern matches names, not file contents.</text>
<text x="14" y="47" class="small">In Bash, <tspan class="code" style="font-size:inherit">*</tspan> matches any string, even empty. <tspan class="code" style="font-size:inherit">*.txt</tspan> matches names ending in <tspan class="code" style="font-size:inherit">.txt</tspan>.</text>
<text x="14" y="57" class="small">Before: these three ordinary files exist in the current directory.</text>
<path fill="#def1e8" d="M15 62 H52 L58 68 V79 H15 Z M70 62 H107 L113 68 V79 H70 Z"/>
<path class="ink thin" d="M15 62 L52 62 L58 68 V79 H15 Z M52 62 V68 H58 M70 62 L107 62 L113 68 V79 H70 Z M107 62 V68 H113 M137 62 L188 62 L194 68 V79 H137 Z M188 62 V68 H194"/>
<text x="21" y="74" class="code">a.txt</text><text x="76" y="74" class="code">b.txt</text><text x="142" y="74" class="code">photo.jpg</text>
<text x="15" y="87" class="small">matches</text><text x="70" y="87" class="small">matches</text><text x="137" y="87" class="small">does not match</text>
<text x="14" y="98" class="small">Command you type</text>
<path fill="#fff0c9" d="M13 101 H99 V115 H13 Z"/>
<text x="18" y="110" class="code" style="font-size:4.8px">printf '%s\n' *.txt</text>
<path class="ink" d="M102 108 H115 M110 104 L116 108 L110 112"/>
<text x="122" y="98" class="small">Shell expands BEFORE running it</text>
<text x="122" y="107" class="code">printf '%s\n' a.txt b.txt</text>
<text x="122" y="116" class="small">Output: <tspan class="code" style="font-size:inherit">a.txt</tspan>, then <tspan class="code" style="font-size:inherit">b.txt</tspan> on a new line.</text>
<text x="14" y="127" class="small"><tspan class="code" style="font-size:inherit">printf</tspan> prints each name; <tspan class="code" style="font-size:inherit">%s</tspan> inserts text, <tspan class="code" style="font-size:inherit">\n</tspan> ends the line. Files are unchanged.</text>
<text x="14" y="136" class="code">printf '%s\n' '*.txt'</text><text x="82" y="136" class="small">Quotes prevent expansion. Output: <tspan class="code" style="font-size:inherit">*.txt</tspan></text>
<text x="14" y="145" class="small">Bash defaults: no match → literal pattern; <tspan class="code" style="font-size:inherit">*.txt</tspan> skips names starting with <tspan class="code" style="font-size:inherit">.</tspan> (such as <tspan class="code" style="font-size:inherit">.a.txt</tspan>).</text>
</svg>

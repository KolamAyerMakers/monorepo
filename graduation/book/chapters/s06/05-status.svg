<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="-8 -2 226 162" role="img" aria-labelledby="title desc">
<rect x="-8" y="-2" width="226" height="162" fill="white"/>
<title id="title">HTTP status codes describe the response.</title><desc id="desc">Examples introduce 200 success, 301 or 302 redirect, 403 refused, 404 not found, and 500 server error. curl -L follows redirects. 404 means a server answered, not that a connection failed.</desc>
<style>text{font-family:Chilanka,'Liberation Sans',sans-serif;font-size:5.2px;fill:#161616}.title{font-size:9px}.small{font-size:4.2px}.code{font-family:'Liberation Mono',monospace;font-size:5px}.ink{fill:none;stroke:#161616;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:.55}</style>
<path fill="white" d="M0 0H210V148H0Z"/><text x="12" y="14" class="small">HTTP REQUESTS AND RESPONSES / 04</text><text x="12" y="28" class="title">HTTP STATUS CODES.</text>
<text x="14" y="38" class="small">A response status is a three-digit code from the server.</text>
<path fill="#def1e8" d="M14 40 H56 V53 H14 Z"/><text x="18" y="50" class="code">200</text><text x="67" y="50">the request succeeded</text>
<text x="18" y="68" class="code">301 / 302</text><text x="67" y="68">look at a different URL</text><text x="18" y="86" class="code">403</text><text x="67" y="86">the server refuses access</text><path fill="#f8e0dc" d="M14 94 H56 V107 H14 Z"/><text x="18" y="104" class="code">404</text><text x="67" y="104">the requested resource wasn't found</text><text x="18" y="122" class="code">500</text><text x="67" y="122">the server hit an internal error</text>
<text x="14" y="140" class="small">Examples, not every status. <tspan class="code" style="font-size:inherit">curl -L</tspan> follows redirects; plain <tspan class="code" style="font-size:inherit">curl</tspan> doesn't.</text>
</svg>

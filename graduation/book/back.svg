      <text x="18" y="55">Pick a page that catches your eye, discover something unexpected,</text>
      <text x="18" y="61">and try it for yourself. You don’t need to read everything in order.</text>
      <text x="18" y="67">Just bring your curiosity.</text>
    </g>
